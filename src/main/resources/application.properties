# Conexión a la DB
spring.datasource.url=jdbc:postgresql://localhost:5432/futbol_db
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Credenciales desde variables de entorno (con fallback para dev local)
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

football.api.api-key=${FOOTBALL_API_KEY}
football.api.api-host=${FOOTBALL_API_HOST:v3.football.api-sports.io}
football.api.base-url=${FOOTBALL_API_BASE_URL:https://v3.football.api-sports.io}
football.api.season=2024
football.api.season-min=2010
football.api.season-max=2024
football.api.daily-limit=100
football.api.league-ids=39,140,135,78,61

# API Football cache
football.api.cache.dir=${java.io.tmpdir}/futbix-cache
football.api.cache.ttl-hours=24