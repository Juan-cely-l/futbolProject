spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Authentication for tests
ADMIN_PASSWORD=test123

# Dummy values for external API config (never actually called in tests)
football.api.api-key=${FOOTBALL_API_KEY_TEST:test-key}
football.api.api-host=v3.football.api-sports.io
football.api.base-url=https://v3.football.api-sports.io
football.api.season=2025
football.api.daily-limit=100
